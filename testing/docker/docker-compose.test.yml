  #     - TEST_OS=fedora
  #     - TEST_OS_VERSION=39
  #     - TEST_PACKAGE_MANAGER=dnf
  #     - TEST_TAGS=unit,integration,dnf
  #   volumes:
  #     - ../..:/workspace
  #   working_dir: /workspace
  #   command: >
